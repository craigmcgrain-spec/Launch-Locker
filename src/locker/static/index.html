<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch Locker</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>Launch Locker</h1>
  <span class="addr">127.0.0.1</span>
</header>
<main>
  <section>
    <h2>Lockers</h2>
    {{lockers}}
  </section>
  <aside class="card" id="card-panel" data-selected="{{selected}}">
    <h2>Model card</h2>
    <p class="hint" id="card-hint">No model card loaded yet.</p>
  </aside>
</main>
<section class="section">
  <h2>Add a locker</h2>
  <form method="post" action="/lockers">
    <label>name<input name="name" required autocomplete="off"></label>
    <label>command<textarea name="command" required placeholder="llama-server -hf Qwen/Qwen3-8B --port 8080"></textarea></label>
    <label>hf repo — optional, detected from the command when blank<input name="hf_repo" autocomplete="off"></label>
    <button type="submit">save</button>
  </form>
</section>
<script>
(function () {
  var panel = document.getElementById('card-panel');
  var hint = document.getElementById('card-hint');
  var selected = panel.dataset.selected || '';
  var rows = Array.prototype.slice.call(document.querySelectorAll('tr.locker'));

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function render(title, meta, extra) {
    panel.innerHTML = '<h2>Model card</h2>' + title + (meta || '') + (extra || '');
  }

  function loadCard(row) {
    if (!row) { return; }

    var pinned = row.dataset.hf || '';
    var params = new URLSearchParams();
    if (pinned) { params.set('repo', pinned); }
    if (row.dataset.command) { params.set('command', row.dataset.command); }

    render('<p class="card-title">' + esc(pinned || row.dataset.name) + '</p>',
           '<p class="hint">Loading model card…</p>');

    fetch('/api/card?' + params.toString())
      .then(function (response) { return response.json(); })
      .then(function (data) {
        if (data.error) {
          render('<p class="card-title">' + esc(data.repo || pinned || 'Model card') + '</p>',
                 '<p class="hint">' + esc(data.message) + '</p>');
          return;
        }

        var meta = [
          data.author,
          data.pipeline_tag,
          '↓ ' + (data.downloads || 0).toLocaleString(),
          '♥ ' + (data.likes || 0),
          data.license,
          data.last_modified ? 'updated ' + String(data.last_modified).slice(0, 10) : ''
        ].filter(Boolean).map(esc).join(' · ');

        var tags = (data.tags || []).map(function (tag) {
          return '<li>' + esc(tag) + '</li>';
        }).join('');

        // readme_html is generated by locker.md, which escapes the whole
        // document before adding any markup of its own.
        render(
          '<p class="card-title">' + esc(data.repo) +
            (data.cached ? ' <span class="hint">(cached)</span>' : '') + '</p>',
          '<p class="card-meta">' + meta + '</p>' +
            (tags ? '<ul class="card-tags">' + tags + '</ul>' : ''),
          '<div class="card-readme">' + (data.readme_html || '<p class="hint">No README.</p>') + '</div>'
        );
      })
      .catch(function () {
        render('<p class="card-title">' + esc(pinned || 'Model card') + '</p>',
               '<p class="hint">Could not load the model card (offline?).</p>');
      });
  }

  function copyText(text, done) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text, done); });
      return;
    }
    legacyCopy(text, done);
  }

  function legacyCopy(text, done) {
    var area = document.createElement('textarea');
    area.value = text;
    document.body.appendChild(area);
    area.select();
    try { document.execCommand('copy'); done(); } finally { document.body.removeChild(area); }
  }

  Array.prototype.forEach.call(document.querySelectorAll('button.copy'), function (button) {
    button.addEventListener('click', function () {
      var label = button.textContent;
      copyText(button.dataset.command || '', function () {
        button.textContent = 'copied';
        setTimeout(function () { button.textContent = label; }, 1200);
      });
    });
  });

  var commandField = document.querySelector('textarea[name=command]');
  if (commandField) {
    commandField.addEventListener('input', function () {
      var match = commandField.value.match(/[A-Za-z0-9._-]+\/[A-Za-z0-9._-]+/);
      hint.textContent = match ? 'detected repo: ' + match[0] : '';
    });
  }

  var active = rows.filter(function (row) { return row.dataset.name === selected; })[0] || rows[0];
  loadCard(active);
})();
</script>
</body>
</html>
