[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "launch-locker"
version = "0.1.0"
description = "Store local AI model launch commands by name and launch them from the CLI"
requires-python = ">=3.11"

[tool.hatch.build.targets.wheel]
packages = ["src/locker"]
